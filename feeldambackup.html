<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dce8bf">
  <title>필담 — 오늘의 문장</title>
  <meta
    name="description"
    content="키링을 대면 만나는 오늘의 문장, 필담."
  >

  <style>
    :root {
      --green: #dce8bf;
      --green-dark: #253d2a;
      --paper: #f7f5eb;
      --ink: #20251e;
      --muted: #73766a;
      --line: rgba(32, 37, 30, .18);
      --accent: #b14932;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--green);
      color: var(--ink);
      font-family: Georgia, "Noto Serif KR", "Batang", serif;
    }

    button { font: inherit; }

    .page {
      width: min(100% - 40px, 1120px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    header {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--green-dark);
      text-decoration: none;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--green-dark);
      border-radius: 50%;
      font-size: 20px;
    }

    .brand-name {
      font-size: 24px;
      letter-spacing: .08em;
      font-weight: 700;
    }

    .brand-note,
    .edition,
    .eyebrow,
    .quote-meta,
    .site-footer {
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    .brand-note {
      margin-left: 3px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .03em;
    }

    .edition {
      color: var(--green-dark);
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 440px);
      align-items: center;
      gap: clamp(36px, 8vw, 120px);
      padding: 56px 0 72px;
    }

    .intro {
      align-self: center;
      padding-bottom: 12px;
    }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
    }

    h1 {
      max-width: 540px;
      margin: 0;
      color: var(--green-dark);
      font-size: clamp(42px, 7vw, 78px);
      font-weight: 500;
      letter-spacing: -.06em;
      line-height: 1.12;
    }

    .intro-copy {
      max-width: 330px;
      margin: 26px 0 0;
      color: #4d5848;
      font-family: Arial, "Noto Sans KR", sans-serif;
      font-size: 14px;
      line-height: 1.9;
    }

    .card {
      position: relative;
      min-height: 440px;
      padding: 32px 34px 28px;
      background: var(--paper);
      box-shadow: 0 15px 38px rgba(40, 48, 31, .09);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 34px;
      width: 42px;
      height: 4px;
      background: var(--accent);
    }

    .card-top,
    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .quote-number,
    .quote-origin {
      color: var(--muted);
      font-family: Arial, "Noto Sans KR", sans-serif;
      font-size: 11px;
      letter-spacing: .1em;
    }

    .quote-origin {
      text-align: right;
      letter-spacing: .04em;
    }

    blockquote {
      margin: 36px 0;
      font-size: clamp(25px, 3vw, 35px);
      line-height: 1.75;
      letter-spacing: -.035em;
      word-break: keep-all;
    }

    .quote-meta {
      margin-top: 16px;
      color: #5f6258;
      font-size: 13px;
      line-height: 1.7;
    }

    .quote-meta strong {
      color: var(--ink);
      font-weight: 700;
    }

    .card-bottom {
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .text-button {
      padding: 8px 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: Arial, "Noto Sans KR", sans-serif;
      font-size: 12px;
    }

    .text-button:hover { color: var(--accent); }

    .actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .draw-button {
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid var(--green-dark);
      background: var(--green-dark);
      color: #fff;
      cursor: pointer;
      font-family: Arial, "Noto Sans KR", sans-serif;
      font-size: 13px;
      transition: background .15s ease, color .15s ease;
    }

    .draw-button:hover {
      background: transparent;
      color: var(--green-dark);
    }

    .draw-button:focus-visible,
    .text-button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .site-footer {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--line);
      color: #58604f;
      font-size: 11px;
      letter-spacing: .04em;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      padding: 11px 16px;
      background: var(--green-dark);
      color: white;
      font: 13px Arial, "Noto Sans KR", sans-serif;
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: .2s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 760px) {
      .page { width: min(100% - 32px, 540px); }
      header { min-height: 72px; }
      .brand-note { display: none; }
      .edition { font-size: 10px; }
      main {
        grid-template-columns: 1fr;
        gap: 32px;
        padding: 42px 0 48px;
      }
      .intro { padding: 0; }
      .eyebrow { margin-bottom: 14px; }
      h1 { font-size: clamp(42px, 12vw, 62px); }
      .intro-copy { margin-top: 14px; }
      .card { min-height: 390px; padding: 28px 24px 22px; }
      .card::before { left: 24px; }
      blockquote { margin: 28px 0; }
      .site-footer { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

    const textEl = document.getElementById("quote-text");
    const authorEl = document.getElementById("quote-author");
    const workEl = document.getElementById("quote-work");
    const numberEl = document.getElementById("quote-number");
    const toastEl = document.getElementById("toast");

    const BAG_KEY = "pildam-quote-bag-v1";
    const LAST_KEY = "pildam-last-quote-v1";
    let currentQuote = null;
    let toastTimer;

    function shuffled(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function getNextIndex() {
      let bag;

      try {
        bag = JSON.parse(localStorage.getItem(BAG_KEY));
      } catch {
        bag = null;
      }

      if (!Array.isArray(bag) || bag.length === 0) {
        bag = shuffled(quotes.map((_, index) => index));

        // 전체 문장을 한 바퀴 돈 직후에도 같은 문장이 연속으로 나오지 않게 함
        const last = Number(localStorage.getItem(LAST_KEY));
        if (bag.length > 1 && bag[bag.length - 1] === last) {
          [bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]];
        }
      }

      const index = bag.pop();
      localStorage.setItem(BAG_KEY, JSON.stringify(bag));
      localStorage.setItem(LAST_KEY, String(index));
      return index;
    }

    function showNextQuote() {
      const index = getNextIndex();
      currentQuote = quotes[index];

      textEl.textContent = `“${currentQuote[0]}”`;
      authorEl.textContent = currentQuote[1];
      workEl.textContent = currentQuote[2];
      numberEl.textContent =
        `NO. ${String(index + 1).padStart(3, "0")} / ${quotes.length}`;
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    document.getElementById("draw-button").addEventListener("click", showNextQuote);

    document.getElementById("copy-button").addEventListener("click", async () => {
      if (!currentQuote) return;

      const text = `“${currentQuote[0]}”\n— ${currentQuote[1]}, ${currentQuote[2]}`;

      try {
        await navigator.clipboard.writeText(text);
        showToast("문장을 복사했어요.");
      } catch {
        showToast("복사 기능은 HTTPS 사이트에서 사용할 수 있어요.");
      }
    });

    document.getElementById("share-button").addEventListener("click", async () => {
      if (!currentQuote) return;

      const text = `“${currentQuote[0]}”\n— ${currentQuote[1]}, ${currentQuote[2]}`;

      if (navigator.share) {
        try {
          await navigator.share({ title: "필담 — 오늘의 문장", text });
        } catch {
          // 사용자가 공유 창을 닫은 경우 아무 동작도 하지 않음
        }
      } else {
        try {
          await navigator.clipboard.writeText(text);
          showToast("공유 문장을 복사했어요.");
        } catch {
          showToast("이 브라우저에서는 공유 기능을 사용할 수 없어요.");
        }
      }
    });

    showNextQuote();
  </script>
